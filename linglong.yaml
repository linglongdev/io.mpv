version: '1'

package:
  id: io.mpv
  name: mpv player
  version: 0.41.0.0
  kind: app
  description: |
    Command line media player

command: [mpv]

base: org.deepin.base/25.2.2

sources:
  - kind: git
    url: https://github.com/mpv-player/mpv.git
    commit: v0.41.0

build: |
  cd /project/linglong/sources/mpv.git
  mkdir -p $PREFIX/etc
  readonly APP_LIB="$PREFIX/lib/$TRIPLET/"
  echo -e "$APP_LIB/samba\n$APP_LIB/blas\n$APP_LIB/lapack" > $PREFIX/etc/ld.so.conf
  meson setup build --prefix="$PREFIX"
  meson compile -C build
  meson install -C build

buildext:
  apt:
    build_depends:
      - build-essential
      - libarchive-dev
      - libasound2-dev
      - libass-dev
      - libavcodec-dev
      - libavdevice-dev
      - libavfilter-dev
      - libavformat-dev
      - libavutil-dev
      - libbluray-dev
      - libcdio-dev
      - libcdio-paranoia-dev
      - libdisplay-info-dev
      - libdrm-dev
      - libdvdnav-dev
      - libegl-dev
      - libffmpeg-nvenc-dev
      - libgbm-dev
      - libgl-dev
      - libjack-dev
      - libjpeg-dev
      - liblcms2-dev
      - liblua5.2-dev
      - libmujs-dev
      - libpipewire-0.3-dev
      - libplacebo-dev
      - libpulse-dev
      - librubberband-dev
      - libsixel-dev
      - libsndio-dev
      - libswscale-dev
      - libuchardet-dev
      - libva-dev
      - libvdpau-dev
      - libvulkan-dev
      - libwayland-dev
      - libx11-dev
      - libxinerama-dev
      - libxkbcommon-dev
      - libxpresent-dev
      - libxrandr-dev
      - libxss-dev
      - libxv-dev
      - libzimg-dev
      - meson
      - ninja-build
      - pkgconf
      - python3-docutils
